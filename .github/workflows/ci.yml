name: CI

# Validates and lints the realm, and checks lifecycle transitions, with the
# released strspc CLI, through SteerSpec/.github's reusable workflow.
#
# Strict: warnings fail the build. Rule bodies are the standard's own text, so
# lint skips the key-word check (RL021) and the inline-example check (RL026)
# in a realm of kind standard (core STDRLM-020 and STDRLM-021, strspc 1.41.0).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rules:
    # Pinned to a commit of SteerSpec/.github (main, 2026-11-07), so an upstream change can't alter
    # these checks without a change here.
    uses: SteerSpec/.github/.github/workflows/strspc-lint.yml@0f165a7f7d88982e2594c67e7f8198770e286265
    permissions:
      contents: read
      pull-requests: read
    with:
      path: rules/
      # Pinned so a CLI release can't change the checks without a change here.
      cli-version: 1.41.0
      strict: true

  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Check the generator compiles
        run: python3 -m py_compile tools/generate.py tools/sentences.py
