name: CI

# Validates the realm with the released strspc CLI.
#
# Until the realm holds entities, only the manifest can be checked: `strspc lint`
# refuses a realm with no entity files (RL000). The pilot (#1) switches this job to
# SteerSpec/.github's reusable strspc-lint workflow, which adds lint and the
# lifecycle diff.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  realm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      # main, 2026-10-20 (SteerSpec/strspc-CLI#92), as in SteerSpec/.github's strspc-lint workflow
      - uses: SteerSpec/strspc-CLI/.github/actions/setup-strspc@1ce43e4484d9451083c0774a9926178889d684f2
        with:
          version: latest

      - name: Validate realm
        run: strspc realm validate rules/ --recursive --strict
